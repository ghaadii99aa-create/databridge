# Local full stack: PostgreSQL + FastAPI + nginx-served frontend.
#   1. copy .env.example to .env and set POSTGRES_PASSWORD
#   2. docker compose up --build
#   3. open http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: databridge
      POSTGRES_USER: databridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U databridge -d databridge"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://databridge:${POSTGRES_PASSWORD}@db:5432/databridge
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      DEMO_MODE: ${DEMO_MODE:-false}
      CORS_ORIGINS: http://localhost:8080
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    volumes:
      - appdata:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
